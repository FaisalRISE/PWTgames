/* ---------- modal, with an eye on every password box ---------- */
function openModal(html){ if(!html) return; modalOpen=true;
  $('modalRoot').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="sheetM">${html}</div></div>`;
  addPeek(); const f=document.querySelector('.sheetM input[type=password],.sheetM input[type=text]'); if(f) setTimeout(()=>f.focus(),40); }
function closeModal(){ modalOpen=false; courtEdit=null; $('modalRoot').innerHTML=''; render(); }
const EYE_OPEN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_SHUT='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function addPeek(){
  document.querySelectorAll('.sheetM input[type=password]').forEach(inp=>{
    if(inp.parentElement.classList.contains('pwWrap')) return;
    const w=document.createElement('div'); w.className='pwWrap'; inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    const b=document.createElement('button'); b.type='button'; b.className='pwEye'; b.innerHTML=EYE_OPEN;
    b.setAttribute('aria-label','Show what is typed'); b.setAttribute('aria-pressed','false');
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('click',()=>{ const show=inp.type==='password'; inp.type=show?'text':'password';
      b.innerHTML=show?EYE_SHUT:EYE_OPEN; b.setAttribute('aria-pressed',String(show)); b.setAttribute('aria-label',show?'Hide what is typed':'Show what is typed');
      inp.focus(); const n=inp.value.length; try{ inp.setSelectionRange(n,n); }catch(e){} });
    w.appendChild(b);
  });
}

/* ========================================================================
   LIVE SYNC — the Pickleboss engine on the shared RISE table. Rows for each
   court-hour, the format, branding, saved formats and passwords, all under
   this event's own prefix; every read filters on it.
   ===================================================================== */
const SUPA_URL='https://utfvjsvvbifwcektzrwj.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0ZnZqc3Z2Ymlmd2Nla3R6cndqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMTAxNzIsImV4cCI6MjEwMTc4NjE3Mn0.gSi-EVADM6NvnQiWN2TahSGNTtys3skyFpAf-E8qoSA';
const SYNC_KEY='risecg_sync1', PULL_MS=4000, PUSH_MS=600;
let sync={on:true,event:'cgnight1',device:'',status:'off',note:'',cursor:null,rev:{},sent:{},dirty:{},busy:false,pulling:false,lastOk:0,pending:0,log:[]};
let pullTimer=null, pushTimer=null;
function syncSave(){ try{ localStorage.setItem(SYNC_KEY,JSON.stringify({on:sync.on,event:sync.event,device:sync.device,cursor:sync.cursor,rev:sync.rev,sent:sync.sent})); }catch(e){} }
function syncLoad(){ let r=null; try{ r=JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); }catch(e){}
  if(r){ sync.on=r.on!==false; sync.event=r.event||sync.event; sync.device=r.device||''; sync.cursor=r.cursor||null; sync.rev=r.rev||{}; sync.sent=r.sent||{}; }
  if(!sync.device) sync.device='Device '+Math.random().toString(36).slice(2,6).toUpperCase(); }
const K_CFG=()=>sync.event+':cfg', K_FMT=()=>sync.event+':fmt', K_BRD=()=>sync.event+':brand', K_TPL=()=>sync.event+':tpl', K_S=id=>sync.event+':s:'+id;
const sessPayload=s=>({id:s.id,start:s.start,mins:s.mins,court:s.court,players:s.players.slice(),plan:s.plan,base:s.base||0,roster:s.roster==null?null:s.roster,
  games:s.games.map(g=>({n:g.n,a:g.a,b:g.b,sit:g.sit,sa:g.sa,sb:g.sb,log:g.log||null,server:g.server||null,posA:g.posA||0,posB:g.posB||0,startLeft:g.startLeft||null}))});
function syncSnapshot(){ const o={};
  if(S.adminHash||S.scorerHash||S.orgHash) o[K_CFG()]={adminHash:S.adminHash||'',scorerHash:S.scorerHash||'',orgHash:S.orgHash||''};
  o[K_FMT()]={meta:S.meta,rules:S.rules,slotMins:S.slotMins,access:ACCESS(),order:S.sessions.map(s=>s.id)};
  o[K_BRD()]={host:HOST(),organisers:ORGANISERS(),sponsors:SPONSORS()};
  if((S.templates||[]).length) o[K_TPL()]={list:S.templates};
  S.sessions.forEach(s=>{ o[K_S(s.id)]=sessPayload(s); }); return o; }
function applyCfg(d){ if(!d) return false; let hit=false;
  if(d.adminHash&&d.adminHash!==S.adminHash){ S.adminHash=d.adminHash; hit=true; }
  if(d.scorerHash!==undefined&&d.scorerHash!==S.scorerHash){ S.scorerHash=d.scorerHash||''; hit=true; }
  if(d.orgHash!==undefined&&d.orgHash!==S.orgHash){ S.orgHash=d.orgHash||''; hit=true; } return hit; }
function applyFmt(d){ if(!d) return false;
  if(d.meta) S.meta=Object.assign({},SEED_META,d.meta); if(d.rules) S.rules=normRules(d.rules);
  if(d.slotMins) S.slotMins=d.slotMins; if(d.access) S.access=normAccess(d.access);
  if(Array.isArray(d.order)){ const by={}; S.sessions.forEach(s=>by[s.id]=s);
    S.sessions=d.order.map(id=>by[id]||{id,start:'20:00',mins:60,court:'',players:[],plan:0,games:[]}); }
  return true; }
function applyBrand(d){ if(!d) return false; const n=normBrand({host:d.host,organisers:d.organisers,sponsors:d.sponsors});
  S.host=n.host; S.organisers=n.organisers; S.sponsors=n.sponsors; return true; }
function applySess(id,d){ if(!d) return false; let s=sessById(id); if(!s){ s={id}; S.sessions.push(s); }
  Object.assign(s,{start:d.start,mins:d.mins,court:d.court,players:(d.players||[]).slice(),plan:d.plan,base:d.base||0,roster:d.roster===undefined?undefined:d.roster,
    games:(d.games||[]).map(g=>({n:g.n,a:g.a.slice(),b:g.b.slice(),sit:(g.sit||[]).slice(),sa:g.sa==null?null:g.sa,sb:g.sb==null?null:g.sb,
      log:g.log||null,server:g.server||null,posA:g.posA||0,posB:g.posB||0,startLeft:g.startLeft||null}))});
  return true; }
function rowAllowed(k){ if(k===K_CFG()||k===K_BRD()||k===K_TPL()) return isAdmin(); if(k===K_FMT()) return isAdmin()||canEdit(); return canScore(); }
function syncScan(){ if(!sync.on) return; const snap=syncSnapshot(); let n=0;
  Object.keys(snap).forEach(k=>{ const s=JSON.stringify(snap[k]); if(sync.sent[k]===s) return;
    if(!rowAllowed(k)){ sync.sent[k]=s; return; } sync.dirty[k]=s; sync.rev[k]=(sync.rev[k]||0)+1; n++; });
  sync.pending=Object.keys(sync.dirty).length; if(n) schedulePush(); syncChrome(); }
function syncBaseline(){ const snap=syncSnapshot(); Object.keys(snap).forEach(k=>{ sync.sent[k]=JSON.stringify(snap[k]); }); sync.dirty={}; sync.pending=0; syncSave(); }
function syncLog(m){ const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); sync.log.unshift(t+' · '+m); if(sync.log.length>8) sync.log.pop(); }
function syncStatus(s,note){ sync.status=s; sync.note=note||''; syncChrome(); }
function syncPillHTML(){ const l={off:'LOCAL',sync:'SYNC…',live:'LIVE',off_line:'OFFLINE',error:'SYNC!'}[sync.status]||'LOCAL';
  return (sync.status==='live'?'<i class="dot"></i>':'')+l+(sync.pending?' '+sync.pending:''); }
function syncChrome(){ const el=$('syncpill'); if(el){ el.className='sync '+sync.status; el.innerHTML=syncPillHTML(); }
  const st=$('syncstat'); if(st){ st.className='alert '+syncAlertCls(); st.innerHTML=syncAlertHTML(); } }
async function supa(path,opts){
  const r=await fetch(SUPA_URL+path,Object.assign({headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'}},opts||{}));
  if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120)); const t=await r.text(); return t?JSON.parse(t):null; }
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(syncPush,PUSH_MS); }
async function syncPush(){
  if(!sync.on||sync.busy) return; const keys=Object.keys(sync.dirty); if(!keys.length) return;
  if(!canScore()){ sync.dirty={}; sync.pending=0; return; }
  sync.busy=true; syncStatus('sync');
  const batch=keys.slice(0,40), items=batch.map(k=>({key:k,data:JSON.parse(sync.dirty[k]),rev:sync.rev[k]}));
  try{ const res=await supa('/rest/v1/rpc/osl_put',{method:'POST',body:JSON.stringify({items,by:sync.device})});
    const ok={}; (res||[]).forEach(r=>ok[r.out_key]=r.out_rev);
    batch.forEach(k=>{ if(ok[k]!==undefined){ sync.sent[k]=sync.dirty[k]; sync.rev[k]=ok[k]; } delete sync.dirty[k]; });
    sync.pending=Object.keys(sync.dirty).length; sync.lastOk=Date.now(); syncSave(); syncStatus('live'); syncLog('sent '+batch.length+' change'+(batch.length>1?'s':''));
    if(sync.pending) schedulePush(); else setTimeout(()=>syncPull(false),150);
  }catch(e){ syncLog('send failed: '+(e.message||e)); syncStatus('off_line',String(e.message||e)); }
  finally{ sync.busy=false; }
}
async function syncPull(force){
  if(!sync.on||sync.pulling) return; sync.pulling=true; if(sync.status!=='live') syncStatus('sync');
  try{ const since=force?null:sync.cursor;
    const rows=await supa('/rest/v1/osl_live?select=key,data,rev,updated_at&order=updated_at.asc&limit=500&key=like.'+encodeURIComponent(sync.event+':')+'*'+
      (since?'&updated_at=gt.'+encodeURIComponent(since):''));
    let changed=0, newest=sync.cursor;
    (rows||[]).forEach(r=>{ if(r.key.indexOf(sync.event+':')!==0) return;
      if(!newest||r.updated_at>newest) newest=r.updated_at; if(sync.dirty[r.key]) return;
      const parts=r.key.split(':'), kind=parts[1], str=JSON.stringify(r.data);
      if(kind==='cfg'){ if(applyCfg(r.data)){ sync.rev[r.key]=r.rev; sync.sent[r.key]=str; changed++; } return; }
      const local=sync.rev[r.key]||0; if(r.rev<local) return; if(r.rev===local&&sync.sent[r.key]===str) return;
      if(S.ref&&kind==='s'&&S.ref.split(':')[0]===parts.slice(2).join(':')) return;   // never yank a game out from under the referee
      let hit=false;
      if(kind==='fmt') hit=applyFmt(r.data); else if(kind==='brand') hit=applyBrand(r.data);
      else if(kind==='tpl'){ if(r.data&&Array.isArray(r.data.list)){ S.templates=r.data.list; hit=true; } }
      else if(kind==='s') hit=applySess(parts.slice(2).join(':'),r.data);
      if(hit){ sync.rev[r.key]=r.rev; sync.sent[r.key]=str; changed++; } });
    sync.cursor=newest;
    if(changed){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){}
      const snap=syncSnapshot(); Object.keys(snap).forEach(k=>{ if(!sync.dirty[k]) sync.sent[k]=JSON.stringify(snap[k]); }); }
    sync.lastOk=Date.now(); syncSave(); syncStatus('live'); syncLog(changed?'received '+changed+' change'+(changed>1?'s':''):'checked · nothing new');
    if(changed){ if(!modalOpen&&!S.ref&&!document.querySelector('input:focus,select:focus,textarea:focus')) render(); else repaintLater=true; }
  }catch(e){ syncLog('pull failed: '+(e.message||e)); syncStatus('off_line',String(e.message||e)); }
  finally{ sync.pulling=false; }
}
function syncStart(){ sync.on=true; syncSave(); syncStatus('sync'); clearInterval(pullTimer); pullTimer=setInterval(()=>syncPull(false),PULL_MS); syncPull(true).then(()=>syncScan()); }
function syncStop(){ sync.on=false; clearInterval(pullTimer); clearTimeout(pushTimer); syncSave(); syncStatus('off'); }
async function syncPublishAll(){ if(!sync.on) return toast('Turn live sync on first'); if(!canScore()) return toast('Unlock scoring first');
  const snap=syncSnapshot(); Object.keys(snap).forEach(k=>{ if(!rowAllowed(k)) return; sync.rev[k]=(sync.rev[k]||0)+1; sync.dirty[k]=JSON.stringify(snap[k]); });
  sync.pending=Object.keys(sync.dirty).length; toast('Publishing '+sync.pending+' rows…'); await syncPush(); }
const syncAlertCls=()=>sync.status==='live'?'ok':(sync.status==='off'?'warn':'bad');
function syncAlertHTML(){ const ago=sync.lastOk?Math.round((Date.now()-sync.lastOk)/1000)+'s ago':'never';
  return '<span>'+(sync.status==='live'?'●':sync.status==='off'?'○':'⚠')+'</span><span><b>'+
    ({off:'Sync is off — this device only',sync:'Connecting…',live:'Live',off_line:'No connection',error:'Sync error'}[sync.status]||'')+'</b>'+
    (sync.on?'<br>Last exchange '+esc(ago)+(sync.pending?' · '+sync.pending+' waiting to send':''):'')+
    (sync.note?'<br><span style="font-weight:400;font-size:11px">'+esc(sync.note)+'</span>':'')+'</span>'; }
function syncModal(){
  return `<h3>Live sync</h3><p class="hint" style="margin-bottom:12px">On by default — open the link on any phone and it follows the scores live.
    Scoring keeps working with no signal; changes queue and go out when the connection returns.</p>
    <div class="alert ${syncAlertCls()}" id="syncstat">${syncAlertHTML()}</div>
    <label class="fl">This device</label><input type="text" value="${attr(sync.device)}" placeholder="Court 1 · Ravi" onchange="sync.device=this.value.trim()||sync.device;syncSave()">
    <p class="hint">Tagged on every change this device makes, so a wrong score can be traced.</p>
    <label class="fl">Event code</label><input type="text" value="${attr(sync.event)}" onchange="changeEvent(this.value)">
    <p class="hint">Every device must share the same code. Change it to run a fresh night without mixing results.</p>
    <div class="eyebrow" style="margin:14px 2px 5px">Activity</div>
    <div class="card" style="font-size:11px;line-height:1.8;color:var(--muted);padding:10px 12px">${sync.log.length?sync.log.map(esc).join('<br>'):'Nothing yet.'}</div>
    <div class="row" style="margin:14px 0">${sync.on?'<button class="btn" onclick="syncStop();openModal(syncModal())">Turn sync off</button>':'<button class="btn acc" onclick="syncStart();openModal(syncModal())">Turn sync on</button>'}
      <button class="btn sm" onclick="syncPull(true)">Check now</button>${canScore()?'<button class="btn sm" onclick="syncPublishAll()">Re-send everything</button>':''}</div>
    <div class="alert ok"><span>⟳</span><span><b>This device is running ${BUILD}</b><br>If a phone behaves differently from the others it is probably on an older copy.
      <div class="row" style="margin-top:8px"><button class="btn sm" onclick="location.replace(location.origin+location.pathname+'?v='+Date.now())">Get the latest version</button></div></span></div>
    <button class="btn acc" style="width:100%;margin-top:12px" onclick="closeModal()">Close</button>`;
}
function changeEvent(v){ v=String(v||'').trim()||'cgnight1'; if(v===sync.event) return;
  sync.event=v; sync.cursor=null; sync.rev={}; sync.sent={}; sync.dirty={}; syncBaseline(); if(sync.on) syncStart(); toast('Event set to '+v); }

/* ---------- not losing the page by accident ----------
   Back closes whatever is open — the court console, a sheet — then returns
   to Games, and a scoring device has to press it twice to leave. */
let backArmed=false, backTimer=null;
function guardHistory(){
  try{ history.pushState({rise:1},'',location.href); }catch(e){ return; }
  window.addEventListener('popstate',()=>{ const repush=()=>{ try{ history.pushState({rise:1},'',location.href); }catch(e){} };
    if(S.ref){ repush(); refFinish(); return; }
    if(modalOpen){ repush(); closeModal(); return; }
    if(S.tab!=='games'&&TABS().some(t=>t[0]==='games')){ repush(); go('games'); return; }
    if(canScore()&&!backArmed){ backArmed=true; repush(); toast('Press back again to leave — every score is already saved');
      clearTimeout(backTimer); backTimer=setTimeout(()=>{backArmed=false;},2600); } });
}
window.addEventListener('beforeunload',e=>{ if(canScore()&&(S.ref||Object.keys(sync.dirty||{}).length)){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('pagehide',()=>{ try{ localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){} });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&sync.on) syncPull(false); });

/* ========================= start ========================= */
syncLoad();
if(!Object.keys(sync.sent).length) syncBaseline();
guardHistory();
render();
if(sync.on){ syncStatus('sync'); pullTimer=setInterval(()=>syncPull(false),PULL_MS); syncPull(true).then(()=>syncScan()); }
else syncStatus('off');
</script>
