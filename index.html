<style>
:root{--r:13px}
html[data-theme="dark"]{
  --bg:#070b16;--surface:#0d1425;--card:#141d33;--cardAlt:#1b2540;--border:#25314e;--borderL:#36476e;
  --text:#e9eef9;--muted:#96a3c4;--dim:#7686ad;--accent:#bef264;--accentD:#84cc16;
  --gold:#fbbf24;--win:#bef264;--loss:#fb7185;--cyan:#2dd4bf;--violet:#a78bfa;--onAccent:#0b1220;
  --accentInk:#d9f99d;--goldInk:#fcd34d;--lossInk:#fda4af;--violetInk:#c4b5fd;--cyanInk:#5eead4;
  --glow1:rgba(45,212,191,.06);--glow2:rgba(190,242,100,.05);
  --court:#2c5d80;--courtDeep:#24506f;--courtLine:#f4f8fb;--kitchen:#a8542c;
}
html[data-theme="light"]{
  --bg:#f6f7fb;--surface:#eef1f7;--card:#ffffff;--cardAlt:#f1f4fa;--border:#dbe1ec;--borderL:#c3ccdc;
  --text:#111827;--muted:#414b58;--dim:#565e6c;--accent:#4d7c0f;--accentD:#3f6212;
  --gold:#b45309;--win:#3f6212;--loss:#be123c;--cyan:#0f766e;--violet:#6d28d9;--onAccent:#ffffff;
  --accentInk:#31500a;--goldInk:#7c4a02;--lossInk:#9f1239;--violetInk:#4c1d95;--cyanInk:#0f5f59;
  --glow1:rgba(15,118,110,.05);--glow2:rgba(77,124,15,.05);
  --court:#2f6b93;--courtDeep:#27597c;--courtLine:#ffffff;--kitchen:#b45f31;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body.reflock{overflow:hidden}
body{background:radial-gradient(1100px 550px at 85% -10%,var(--glow1),transparent 60%),
  radial-gradient(900px 500px at -10% 5%,var(--glow2),transparent 55%),var(--bg);
  color:var(--text);font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:74px}
.wrap{max-width:1120px;margin:0 auto;padding:16px 12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{height:38px;width:auto;flex:none;display:block}
html[data-theme="dark"] .logo.inv{filter:invert(1) brightness(1.9)}
.logo.sm{height:26px;opacity:.9}
.leadMarks{display:flex;align-items:center;gap:10px;flex:none}
.leadMarks .logo{height:52px;width:auto;max-width:170px;object-fit:contain}
@media(max-width:520px){.leadMarks .logo{height:42px;max-width:130px}}
.byOrg{font-size:11px;color:var(--dim);margin-top:2px;font-weight:600}
h1{font:800 23px 'Bricolage Grotesque','Outfit',sans-serif;letter-spacing:-.02em;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.hdr-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);padding:6px 10px;border-radius:99px;font:700 10.5px 'Outfit',system-ui,sans-serif;letter-spacing:.05em;cursor:pointer}
.sync .dot{width:7px;height:7px;border-radius:99px;background:currentColor;display:inline-block}
.sync.live{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.sync.live .dot{animation:pulse 1.6s infinite}
.sync.sync{color:var(--cyan)}.sync.off{color:var(--dim)}
.sync.off_line,.sync.error{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.modebtn{border:1px solid var(--borderL);background:var(--cardAlt);color:var(--muted);padding:6px 11px;
  border-radius:99px;font:700 10.5px 'Outfit',system-ui,sans-serif;letter-spacing:.05em;cursor:pointer}
.modebtn.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.iconbtn{border:1px solid var(--border);background:var(--card);color:var(--muted);width:32px;height:30px;
  border-radius:99px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.pill{background:var(--card);border:1px solid var(--border);padding:5px 10px;border-radius:99px;font-size:11.5px;color:var(--muted)}
.pill b{color:var(--text);font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);display:flex;overflow-x:auto}
nav button{flex:1;min-width:66px;background:none;border:0;color:var(--dim);padding:11px 5px 12px;
  font:600 12px 'Outfit',system-ui,sans-serif;cursor:pointer;border-top:2px solid transparent}
nav button.on{color:var(--accentInk);border-top-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;
  border-radius:99px;font:600 13px 'Outfit',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.chip i{font-style:normal;opacity:.7;font-size:11px;margin-left:3px}
.btn{background:var(--cardAlt);border:1px solid var(--borderL);color:var(--text);padding:9px 14px;
  border-radius:9px;font:600 13px 'Outfit',system-ui,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.dgr{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{color:var(--dim);font-size:12.5px;line-height:1.6}
.eyebrow{font:700 10px 'Outfit',system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.hidden{display:none}
.expbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center}

/* a court-hour */
.sess{padding:0;overflow:hidden}
.sessHd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 13px 8px}
.sessHd .ct{font:800 18px 'Bricolage Grotesque','Outfit',system-ui,sans-serif;line-height:1.1}
.sessHd .tm{font-size:11.5px;color:var(--dim);margin-top:3px}
.liveTag{font:800 10px 'Outfit',system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--accentInk);
  background:color-mix(in srgb,var(--accent) 16%,transparent);padding:4px 8px;border-radius:99px;white-space:nowrap}
.doneTag{font:800 10px 'Outfit',system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);border:0;cursor:pointer;
  background:var(--surface);padding:4px 8px;border-radius:99px;white-space:nowrap}
.pchips{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 10px}
.pc{font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:99px;
  padding:3px 9px;cursor:pointer;color:var(--text)}
.pc i{font-style:normal;color:var(--dim);font-weight:500;font-size:10.5px;margin-left:3px}
.grow{display:flex;gap:9px;padding:9px 12px;border-top:1px solid var(--border);align-items:flex-start}
.grow.now{background:color-mix(in srgb,var(--accent) 7%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.gno{width:46px;flex:none;display:flex;flex-direction:column;gap:1px;padding-top:4px}
.gno b{font:800 13px 'Outfit',system-ui,sans-serif}
.gno span{font-size:10px;color:var(--dim)}
.gbody{flex:1;min-width:0}
.gline{display:flex;align-items:center;gap:7px}
.side{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.side .nm{font-size:13.5px;overflow-wrap:break-word}
.side.b{text-align:right;align-items:flex-end}
.rpt{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:999px;font:700 10px 'Outfit',system-ui,sans-serif;letter-spacing:.02em;
  color:var(--goldInk);background:color-mix(in srgb,var(--gold) 16%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);white-space:nowrap}
.rptSum .dimtxt{color:var(--dim);font-weight:600}
.rptSum{margin:0 13px 10px;padding:7px 10px;border-radius:9px;font-size:11.5px;line-height:1.45;color:var(--goldInk);
  background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.side.w .nm{color:var(--win);font-weight:700}
.side.l .nm{color:var(--muted)}
input.sc{width:44px;height:36px;text-align:center;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:7px;font:700 15px 'Outfit',system-ui,sans-serif;flex:none}
input.sc:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
input.sc.filled{border-color:var(--borderL)}
input.sc:disabled{opacity:.85}
input.sc.odd{border-color:var(--gold)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.sep{color:var(--dim);font-size:12px;flex:none}
.sit{font-size:11px;color:var(--dim);margin-top:5px}
.sit b{color:var(--muted);font-weight:600}
.refbtn{flex:none;border:1px solid var(--borderL);background:var(--cardAlt);color:var(--muted);
  border-radius:7px;padding:6px 8px;font:700 10px 'Outfit',system-ui,sans-serif;cursor:pointer;letter-spacing:.05em;margin-left:4px}
.refbtn:hover{border-color:var(--accent);color:var(--accent)}
.liveDot{color:var(--accent);font-size:9px}
.oddWarn{margin-top:6px;padding:6px 8px;border-radius:7px;font-size:11.5px;font-weight:600;
  background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--goldInk)}
.sessFt{display:flex;gap:7px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}
.folded{padding:9px 13px 12px;font-size:12px;color:var(--dim);border-top:1px solid var(--border)}

/* players tab */
.pcard{padding:12px 13px;cursor:pointer}
.pcard:hover{border-color:var(--borderL)}
.pcard .pn{font:800 16px 'Bricolage Grotesque','Outfit',system-ui,sans-serif}
.pcard .pr{font-size:12px;color:var(--muted);margin-top:2px}
.pcard .nx{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12.5px;line-height:1.45}
.pcard .nx .eyebrow{display:block;margin-bottom:2px}

/* tables */
.hd{font:700 11px 'Outfit',system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  padding:12px 12px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hd b{color:var(--text);font-size:14px;letter-spacing:0;text-transform:none}
.tblWrap{padding:0 10px 10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 9.5px 'Outfit',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  text-align:right;padding:8px 4px;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child,th.l{text-align:left}
td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.name{white-space:normal;line-height:1.3;min-width:110px;text-align:left}
td.name .lk{cursor:pointer}
td.name .lk:hover{color:var(--accent)}
.rk{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:5px;
  font:700 11px 'Outfit',system-ui,sans-serif;background:var(--surface);color:var(--muted);margin-right:7px;vertical-align:1px}
.rk.r1{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--goldInk)}
.rk.r2{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--text)}
.rk.r3{background:color-mix(in srgb,#d97706 22%,transparent);color:#b45309}
.pos{color:var(--accent)}.neg{color:var(--loss)}
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.hlc{padding:12px 13px}
.hlc .eyebrow{display:block;margin-bottom:5px}
.hlc .big{font:800 17px 'Bricolage Grotesque','Outfit',system-ui,sans-serif;line-height:1.2;overflow-wrap:anywhere}
.hlc .sm2{font-size:12px;color:var(--muted);margin-top:3px}
.form{display:inline-flex;gap:2px}
.form i{font-style:normal;width:15px;height:15px;border-radius:3px;font:800 9px 'Outfit',system-ui,sans-serif;display:inline-flex;
  align-items:center;justify-content:center;color:#fff}
.form i.W{background:#4d7c0f}.form i.L{background:#be123c}
.statbox{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.statbox div{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center}
.statbox b{display:block;font:800 18px 'Bricolage Grotesque','Outfit',system-ui,sans-serif}
.statbox span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

/* forms */
.ed{padding:14px}
.fl{display:block;font:600 10.5px 'Outfit',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
input.txt,select.txt{width:100%;min-width:0;height:38px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:0 10px;font:500 13.5px 'Outfit',system-ui,sans-serif}
input.txt:focus,select.txt:focus{outline:0;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
@media(max-width:520px){.frow{grid-template-columns:1fr}}
.edRow.dup input.txt{border-color:var(--loss)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--loss) 30%,transparent);
  background:color-mix(in srgb,var(--loss) 7%,var(--card))}
.edRow.dup .ix{color:var(--loss)}
.edRow.dup{margin-bottom:3px}
.dupTag{margin:0 0 9px 26px;font-size:11.5px;font-weight:600;line-height:1.35;color:var(--lossInk)}
.dupBan{margin-bottom:12px}.dupBan ul{margin:6px 0 0;padding-left:18px}
.gName{flex:1;font-size:14px;font-weight:600;padding:6px 0;cursor:pointer}
.grid.g3{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.grid.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1080px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.crtRow{display:grid;grid-template-columns:1.4fr 1.2fr .8fr .8fr auto;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--borderL)}
.crtRow .crtDel{margin-bottom:4px}
.crtRow .crtMeta{grid-column:1/-1;font-size:11.5px;color:var(--dim)}
@media(max-width:560px){.crtRow{grid-template-columns:1fr 1fr auto}.crtRow>div:nth-child(1){grid-column:1/3}.crtRow .crtDel{grid-column:3;grid-row:1}}
.chipSep{width:1px;align-self:stretch;background:var(--border);margin:2px 2px}
.rdMark{padding:7px 14px;font:800 10.5px 'Outfit',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);background:var(--cardAlt);border-top:1px solid var(--borderL)}
.hdBtns{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.editBtn{padding:5px 10px;font-size:11.5px}
.slotRow{display:grid;grid-template-columns:18px 1fr 118px;gap:8px;align-items:end;margin-bottom:8px}
.slotRow .ix{color:var(--dim);font:700 11px 'Outfit',system-ui,sans-serif;padding-bottom:12px}
.slotRow .slotCourts{grid-column:2/4;font-size:11.5px;color:var(--dim);margin-top:-2px}
.cmRow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.cmRow .cmName{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmRow .cmSel{flex:0 1 150px;width:150px;padding:7px 8px;font-size:13px}
.cmRow #cm_new{flex:1;min-width:0}
.edRow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.edRow .ix{width:18px;color:var(--dim);font:700 11px 'Outfit',system-ui,sans-serif;flex:none}
.bSep{height:1px;background:var(--border);margin:16px 0}
.alert{display:flex;gap:9px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin:6px 0}
.alert.ok{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);color:var(--accentInk)}
.alert.warn{background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);color:var(--goldInk)}
.alert.bad{background:color-mix(in srgb,var(--loss) 12%,transparent);border:1px solid color-mix(in srgb,var(--loss) 38%,transparent);color:var(--lossInk)}
.alert b{color:var(--text)}
.alert ul{margin:5px 0 0;padding-left:18px}
.rsRow{display:flex;align-items:center;gap:10px;justify-content:space-between;
  border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.rsT{font-size:13.5px;font-weight:700}
.rsN{font-size:11.5px;color:var(--dim);margin-top:1px}
/* on/off switches */
.sw{position:relative;width:42px;height:24px;border-radius:99px;border:1px solid var(--borderL);
  background:var(--surface);cursor:pointer;padding:0;flex:none;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{transform:translateX(18px);background:#fff}
.accGrid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);margin-top:12px;border:1px solid var(--border);border-radius:11px;overflow:hidden}
.accGrid>div{padding:9px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.accH{font:700 10px 'Outfit',system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);background:var(--surface);justify-content:center}
.accH:first-child{justify-content:flex-start}
.accT{font-weight:600;font-size:13.5px}
.accC{justify-content:center}
.accRow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border)}
.accRow:last-child{border-bottom:0}
/* organisers, sponsors, host */
.orgList{display:flex;flex-direction:column;gap:9px}
.orgRow{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:9px 10px}
.orgPos{width:34px;flex:none;text-align:center;font:700 11px 'Outfit',system-ui,sans-serif;color:var(--dim);padding-top:10px}
.orgMain{display:inline-block;font-size:8px;letter-spacing:.1em;padding:2px 5px;border-radius:4px;
  background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accentInk)}
.orgLogo{width:92px;height:52px;flex:none;border:1px dashed var(--borderL);border-radius:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card);padding:5px}
.orgLogo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
html[data-theme="dark"] .orgLogo.inv img{filter:invert(1) brightness(1.9)}
.orgLogo.empty span{font:700 9px 'Outfit',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center}
.orgMid{flex:1;min-width:0}
.orgBtns{display:flex;flex-direction:column;gap:4px;flex:none}
.orgBtns .btn{padding:4px 8px;line-height:1.1}
.orgRow.host{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
@media(max-width:560px){.orgRow{flex-wrap:wrap}.orgMid{flex:1 1 100%;order:3}}
/* share-as-image menu */
.imgGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imgOpt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:11px 12px;
  border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit}
.imgOpt:hover{border-color:var(--accent)}
.imgOpt b{font:700 13.5px 'Outfit',system-ui,sans-serif}
.imgOpt span{font-size:11.5px;color:var(--dim);line-height:1.35}
@media(max-width:420px){.imgGrid{grid-template-columns:1fr}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,7,15,.66);backdrop-filter:blur(4px);z-index:90;
  display:flex;align-items:flex-end;justify-content:center}
.sheetM{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;
  max-width:600px;max-height:90vh;overflow:auto;padding:20px 18px 26px}
@media(min-width:620px){.scrim{align-items:center;padding:20px}.sheetM{border-radius:16px}}
.sheetM h3{font:800 19px 'Bricolage Grotesque','Outfit',system-ui,sans-serif;margin:0 0 4px}
.sheetM input[type=text],.sheetM input[type=password],.sheetM select{width:100%;height:38px;background:var(--card);
  border:1px solid var(--border);color:var(--text);border-radius:9px;padding:0 11px;font:500 14px 'Outfit',system-ui,sans-serif}
.sheetM input:focus,.sheetM select:focus{outline:0;border-color:var(--accent)}
.pwWrap{position:relative}
.sheetM .pwWrap input{padding-right:46px}
.pwEye{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:40px;height:34px;display:flex;align-items:center;
  justify-content:center;border:0;background:none;color:var(--dim);cursor:pointer;border-radius:7px;padding:0}
.pwEye:hover,.pwEye[aria-pressed="true"]{color:var(--accent)}
.hint{color:var(--dim);font-size:12px;line-height:1.55;margin:6px 0 0}
.shareBox{width:100%;height:220px;margin-top:10px;background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:9px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--accent);
  color:var(--onAccent);padding:10px 18px;border-radius:99px;font:600 13px 'Outfit',system-ui,sans-serif;z-index:120;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.sponsFoot{margin-top:26px;padding:14px 4px 13px;border-top:1px solid var(--border)}
.sponsFoot .eyebrow{display:block;margin-bottom:8px}
.sponsRow{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.sponsItem{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);font-weight:600}
.sponsItem .logo{height:26px;width:auto;max-width:104px;object-fit:contain}
.sitefoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px;padding:14px 4px 0;border-top:1px solid var(--border)}
.sponsFoot+.sitefoot{margin-top:0;border-top:0;padding-top:0}
.fLine{font-size:12px;color:var(--dim);line-height:1.6}
.fLine b{color:var(--muted)}
a.tel{color:var(--accent);font-weight:700;text-decoration:none}

/* referee console */
.refWrap{position:fixed;inset:0;z-index:95;background:var(--bg);overflow:auto;padding:12px 10px 40px}
.refInner{max-width:1000px;margin:0 auto}
.refTop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.refTop .ttl{flex:1;min-width:0;font:800 15px 'Bricolage Grotesque','Outfit',system-ui,sans-serif}
.refTop .sub2{font:700 10px 'Outfit',system-ui,sans-serif;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.scorestrip{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:stretch;margin-bottom:10px}
.sTeam{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px 11px;position:relative;overflow:hidden}
.sTeam .stripe{position:absolute;top:0;left:0;right:0;height:3px}
.sTeam .nm2{font-size:12.5px;font-weight:700;line-height:1.25}
.sTeam .num{font:800 44px 'Bricolage Grotesque','Outfit',system-ui,sans-serif;line-height:.95;margin-top:2px}
.sTeam.right{text-align:right}
.phasebox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:0 3px}
.phasebox .cv{font:800 17px 'Bricolage Grotesque','Outfit',system-ui,sans-serif;color:var(--gold);line-height:1;display:flex;align-items:center;gap:3px}
.phasebox .cl{font:800 8px 'Outfit',system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.tossbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:9px 11px;margin-bottom:8px}
.tossbar .dimtxt{color:var(--dim);font-size:11px;font-weight:600}
.court{position:relative;display:grid;grid-template-columns:1fr 7px 1fr;border-radius:10px;overflow:hidden;border:3px solid var(--courtLine);margin-bottom:9px;user-select:none;box-shadow:0 2px 14px rgba(0,0,0,.22)}
.half{display:grid;grid-template-rows:1fr 1fr;background:var(--court);position:relative}
.half.b{background:var(--courtDeep)}
.net{background:repeating-linear-gradient(180deg,#f8fafc 0 4px,#94a3b8 4px 8px);border-left:1px solid rgba(0,0,0,.25);border-right:1px solid rgba(0,0,0,.25)}
.kitchen{position:absolute;top:0;bottom:0;width:20%;z-index:1;pointer-events:none;background:var(--kitchen)}
.half.a .kitchen{right:0;border-left:2px solid var(--courtLine)}
.half.b .kitchen{left:0;border-right:2px solid var(--courtLine)}
.kitchen:after{content:'KITCHEN';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font:800 8px 'Outfit',system-ui,sans-serif;letter-spacing:.2em;color:rgba(255,255,255,.55)}
.cbox{position:relative;z-index:2;padding:12px 12px 21px;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:4px;cursor:pointer}
.half.a .cbox{padding-right:calc(20% + 10px)}
.half.b .cbox{padding-left:calc(20% + 10px)}
.half .cbox:first-child{border-bottom:2px solid var(--courtLine)}
.cbox:hover{background:rgba(255,255,255,.08)}
.cbox.locked{cursor:default}
.cbox.serving{background:rgba(253,224,71,.13)}
.posTag{font:800 8.5px 'Outfit',system-ui,sans-serif;letter-spacing:.11em;color:rgba(255,255,255,.72);text-transform:uppercase}
.pSlot{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.pSlot .sl{font:800 12px 'Outfit',system-ui,sans-serif;color:#fde047;flex:none}
.pSlot .pn{font-size:14.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.ball{flex:none;display:inline-block;vertical-align:-2px}
.servetag.ghost{visibility:hidden}
.ballSlot{display:inline-flex;width:16px;height:16px;flex:none}
.pSlot{flex-wrap:nowrap!important}
.pSlot .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gamept{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:34px;box-sizing:border-box}
.gamept.idle{background:var(--card);border:1px solid var(--border);color:var(--dim);font-weight:600}
.sTeam .nm2{min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.servetag{font:800 8.5px 'Outfit',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fde047;margin-top:2px}
.taphint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:800 8.5px 'Outfit',system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;color:rgba(255,255,255,.6);letter-spacing:.07em;text-transform:uppercase;z-index:3;pointer-events:none}
.endsnote{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:10px}
.ctrls{display:grid;gap:8px;margin-bottom:10px}
@media(min-width:620px){.ctrls{grid-template-columns:1fr 1fr}}
.ctrlrow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:8px 10px}
.ctrlrow .tl{flex:1;min-width:0;font-size:12.5px;font-weight:700}
.rbtn{width:44px;height:38px;border-radius:9px;border:1px solid var(--borderL);background:var(--cardAlt);color:var(--text);font:800 20px 'Outfit',system-ui,sans-serif;cursor:pointer;flex:none;line-height:1}
.rbtn:disabled{opacity:.35;cursor:default}
.rbtn.plus{border:0;color:#fff}
.gamept{border-radius:9px;padding:8px 11px;font:700 12px 'Outfit',system-ui,sans-serif;text-align:center;margin-bottom:9px;background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--goldInk)}
.gamept.win{background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accentInk)}
.gamept.golden{background:color-mix(in srgb,var(--loss) 12%,transparent);border-color:color-mix(in srgb,var(--loss) 48%,transparent);color:var(--lossInk)}

/* print */
#printArea{display:none}
@media print{
  @page{margin:10mm}
  body{background:#fff!important;color:#000!important;padding:0}
  .wrap,nav,.toast,#modalRoot,#refRoot{display:none!important}
  #printArea{display:block;font-family:'Outfit',Arial,sans-serif;color:#000}
  #printArea .pg{page-break-after:always}
  #printArea .pg:last-child{page-break-after:auto}
  #printArea .bb{display:flex;align-items:center;gap:10px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  #printArea .bb img{height:40px;width:auto;max-width:150px;object-fit:contain}
  #printArea .bb .bt{flex:1}
  #printArea .bb .t{font-size:16px;font-weight:800}
  #printArea .bb .r{font-size:10px;color:#555}
  #printArea .bb .ct{text-align:right;font-size:9.5px;color:#333}
  #printArea .bb .ct b{display:block;font-size:12px}
  #printArea h4{font:800 13px 'Outfit',Arial;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 5px;border-bottom:1.5px solid #222;padding-bottom:3px}
  #printArea h4 span{font-weight:500;text-transform:none;color:#555;letter-spacing:0}
  #printArea table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
  #printArea th{border:1px solid #888;background:#eee;color:#000;padding:4px 6px;font-size:9px;text-align:left}
  #printArea td{border:1px solid #999;padding:0 6px;height:9mm;text-align:left;white-space:normal;color:#000}
  #printArea th.n,#printArea td.n{width:11mm;text-align:center}
  #printArea th.tm,#printArea td.tm{width:17mm;text-align:center}
  #printArea th.sc,#printArea td.sc{width:14mm;text-align:center;font-weight:800}
  #printArea th.st,#printArea td.st{width:26mm}
  #printArea td.w{font-weight:800}
  #printArea tr.rd td{font:800 10px 'Outfit',Arial;text-transform:uppercase;letter-spacing:.06em;background:#f1f1f1;padding:4px 6px}
  #printArea i.rp{font-style:normal;color:#a16207;font-weight:800}
  #printArea table.ps{font-size:9px}
  #printArea table.ps td{height:12mm;padding:1px 3px;text-align:center;line-height:1.15}
  #printArea table.ps th{text-align:center;padding:3px 2px;font-size:8px}
  #printArea table.ps th.who,#printArea table.ps td.who{width:28mm;text-align:left;font-size:10.5px;font-weight:800;padding-left:5px}
  #printArea table.ps td .c{display:block;font-weight:800;font-size:10px}
  #printArea table.ps td.off{color:#aaa}
  #printArea .legend{margin-top:7px;font-size:8.5px;color:#777}
  #printArea .pstrip{margin-top:10px;padding-top:6px;border-top:1px solid #ddd;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  #printArea .pstrip .plbl{font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:#777}
  #printArea .pstrip .pitem{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:#333}
  #printArea .pstrip .pitem img{height:17px;width:auto;max-width:74px;object-fit:contain}
  #printArea .foot{margin-top:10px;font-size:9px;color:#555;text-align:center;border-top:1px solid #bbb;padding-top:5px}
  #printArea .foot img{height:15px;vertical-align:-3px;margin-right:5px}
}
</style>

/* ===================== the game =====================
   As in Pickleboss: to 15, two clear, the two-point rule stops at 17–17 and
   the next rally wins — 18–17 is the highest possible score. */
const RULES_DEFAULT = { target:15, winBy:2, golden:true, goldenAt:17, switchAt:8 };
let TARGET=15, WIN_BY=2, GOLDEN=17, CAP=18, SWITCH_AT=8;
function normRules(r){
  r=Object.assign({},RULES_DEFAULT,r||{});
  const int=(v,d)=>{ const n=parseInt(v,10); return isNaN(n)?d:n; };
  r.target=Math.min(99,Math.max(1,int(r.target,15)));
  r.winBy=(+r.winBy===1)?1:2;
  r.golden=!!r.golden && r.winBy===2;
  r.goldenAt=Math.min(98,Math.max(r.target-1,int(r.goldenAt,r.target+2)));
  r.switchAt=Math.min(99,Math.max(0,int(r.switchAt,0)));
  return {target:r.target,winBy:r.winBy,golden:r.golden,goldenAt:r.goldenAt,switchAt:r.switchAt};
}
function applyRules(){
  S.rules=normRules(S.rules); const r=S.rules;
  TARGET=r.target; WIN_BY=r.winBy; SWITCH_AT=r.switchAt||Infinity;
  if(r.golden){ GOLDEN=r.goldenAt; CAP=r.goldenAt+1; } else { GOLDEN=Infinity; CAP=Infinity; }
}
const maxScore=()=>isFinite(CAP)?CAP:99;
const gameOver=(a,b)=>((a>=TARGET||b>=TARGET)&&Math.abs(a-b)>=WIN_BY)||a>=CAP||b>=CAP;
const isGolden=(a,b)=>a>=GOLDEN&&b>=GOLDEN&&!gameOver(a,b);
function gamePointSides(a,b){ if(gameOver(a,b)) return []; const o=[];
  if(gameOver(a+1,b)) o.push('a'); if(gameOver(a,b+1)) o.push('b'); return o; }
function rulesShort(r){
  r=r||S.rules; let t='to '+r.target;
  if(r.winBy===1) t+=' · no deuce';
  else if(r.golden && r.goldenAt===r.target-1) t+=' · golden point at '+r.goldenAt+'–'+r.goldenAt;
  else if(r.golden) t+=' · win by 2 · golden point at '+r.goldenAt+'–'+r.goldenAt;
  else t+=' · win by 2';
  return t;
}
function rulesPara(r){
  r=r||S.rules; let t;
  if(r.winBy===1) t=`Game to ${r.target} — the first side to ${r.target} wins.`;
  else if(r.golden) t=`Game to ${r.target}, won by 2 clear points. At ${r.goldenAt}–${r.goldenAt} the next rally is the golden point, so ${r.goldenAt+1} is the highest possible score.`;
  else t=`Game to ${r.target}, won by 2 clear points, with no cap.`;
  return t+(r.switchAt?` Ends change when a side reaches ${r.switchAt}.`:' No change of ends.');
}
const played = g => !!g && g.sa!=null && g.sb!=null && g.sa!==g.sb;
const oddScore = g => !!g && g.sa!=null && g.sb!=null && !gameOver(g.sa,g.sb);
const touched = g => g.sa!=null || g.sb!=null || (g.log&&g.log.length);

/* ===================== time ===================== */
const toMin = t => { const m=/^(\d{1,2}):(\d{2})/.exec(String(t||'')); return m?(+m[1])*60+(+m[2]):0; };
function clock(min,full,ampm){
  min=((min%1440)+1440)%1440;
  const h=Math.floor(min/60), m=min%60, h12=((h+11)%12)+1;
  return h12+((m||full)?':'+String(m).padStart(2,'0'):'')+(ampm===false?'':' '+(h<12?'AM':'PM'));
}
function timeRange(s){
  const a=toMin(s.start), b=a+(s.mins||60), half=x=>Math.floor((((x%1440)+1440)%1440)/720);
  return (half(a)===half(b)?clock(a,false,false):clock(a))+' – '+clock(b);
}
/* A slot is every court-hour that starts at the same time. It is called by its
   time (8 – 9 PM), by its number (Slot 1, Slot 2 …) or by a name typed in Setup. */
const slotStarts = () => [...new Set(S.sessions.map(s=>s.start))].sort((a,b)=>toMin(a)-toMin(b));
const showTimes = () => (S.meta.slotMode||'time')!=='slot';
function slotName(start){ const nm=((S.meta.slotNames||{})[start]||'').trim(); if(nm) return nm;
  return showTimes()?'':'Slot '+(slotStarts().indexOf(start)+1); }
function range(s){ return slotName(s.start)||timeRange(s); }
const gameMin = (s,i) => toMin(s.start)+i*(S.slotMins||SLOT_DEFAULT);
const gameTime = (s,i) => showTimes()?clock(gameMin(s,i),true):'';
const defaultPlan = (mins,slot) => Math.max(1,Math.floor((mins||60)/(slot||SLOT_DEFAULT)));

/* ===================== the rotation =====================
   Every possible game on a court is four of its players split into two
   pairs, the rest sitting out. A short beam search picks the order: keep
   everyone's games level first (whoever has played most sits next, never
   the same person twice running), then avoid repeating a partnership, then
   spread the opponents, and only repeat an exact match-up once the fresh
   ones are gone. It is deterministic, so every phone deals the same games. */
const pairKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const matchKey=g=>[[...g.a].sort().join('&'),[...g.b].sort().join('&')].sort().join(' v ');
function candidates(players){
  const P=players.filter(Boolean), n=P.length, out=[];
  if(n<4) return out;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++){
    const f=[P[a],P[b],P[c],P[d]], sit=P.filter((_,i)=>i!==a&&i!==b&&i!==c&&i!==d);
    [[0,1,2,3],[0,2,1,3],[0,3,1,2]].forEach(([w,x,y,z])=>out.push({a:[f[w],f[x]],b:[f[y],f[z]],sit}));
  }
  return out;
}
function newHist(players){ const h={play:{},part:{},opp:{},match:{},streak:{},last:null}; players.forEach(p=>{h.play[p]=0;h.streak[p]=0;}); return h; }

function addHist(h,g){

  g.a.forEach(x=>g.b.forEach(y=>{ const k=pairKey(x,y); h.opp[k]=(h.opp[k]||0)+1; }));

/* ===================== fixture rounds =====================
   The rules every round follows, whatever the group size:
     1. everyone partners everyone at least once;
     2. no game (the same two pairs facing each other) is played twice in a round;
     3. everyone plays the same number of games (or within one, when the
        numbers cannot split evenly);
     4. nobody plays more than 2 games in a row or sits out more than 2 —
        3 only where the numbers make 2 impossible, and never 4 (the one
        exception is 5 players: only one rests each game, so everyone plays
        4 in a row);
     5. everyone plays against everyone at least once;
     6. a pair that has to partner twice is spread apart, and marked on the
        Games tab so nobody is surprised.
   Rules 4 and 6 hold across the join too, so the round can simply repeat.
   Worked out in advance (characters are places in the group list, a = 10th;
   13v24 = 1st & 3rd v 2nd & 4th):
     4 →  3 games · 3 each · everyone plays every game
     5 →  5 games · 4 each · partners exactly once · 4 in a row (one rests per game)
     6 →  9 games · 6 each · three pairs partner twice · at most 2 in a row, never sits 2
     7 → 11 games · 6–7 each · one pair twice · at most 2 in a row, at most 2 out
     8 → 14 games · 7 each · partners exactly once · at most 2 in a row, at most 2 out
     9 → 18 games · 8 each · partners exactly once · at most 2 in a row, at most 2 out (3 once, across the join)
    10 → 25 games · 10 each · at most 2 in a row, at most 3 out

const ROUNDS = {
  4:'13v24 14v23 12v34',
  5:'15v34 24v35 14v23 13v25 12v45',
  6:'12v34 13v56 25v46 14v23 15v36 26v45 13v24 16v35 24v56',
  7:'27v35 13v47 12v56 24v37 15v36 45v67 17v23 14v26 34v57 16v37 25v46',
  8:'25v38 16v45 23v47 12v58 17v36 48v57 18v24 26v35 34v78 14v68 27v56 15v37 28v46 13v67',
  9:'19v58 24v67 36v59 18v47 27v56 28v39 13v49 26v57 29v48 14v35 69v78 12v37 15v46 45v89 17v23 68v79 25v34 16v38',
  10:'28v57 13v48 67v9a 25v8a 14v36 19v47 27v5a 16v38 45v89 23v7a 15v34 26v49 6av78 1av59 24v37 68v9a 17v35 2av46 18v69 39v57 12v4a 26v58 38v79 14v29 3av56'

function roundOf(players){
  const P=players.filter(Boolean), pat=ROUNDS[P.length]; if(!pat) return null;

}

  const R=roundOf(players); if(R) return R.length;
  const n=players.filter(Boolean).length; if(n<4) return 0;

function dealNext(s,existing,count){
  if(count<=0) return [];
  const R=roundOf(s.players), base=s.base||0, tail=existing.slice(base);
  if(R&&existing.length>=base&&tail.every((g,i)=>matchKey(g)===matchKey(R[i%R.length])))
    return Array.from({length:count},(_,k)=>freshGame(R[(tail.length+k)%R.length]));

}

  const R=roundOf(s.players), base=s.base||0, tail=s.games.slice(base);

}
function replan(s){
  const key=rosterKey(s);

  if(s.roster!==key){                                     // the group changed — scored games stay, a fresh round starts
    const keep=s.games.filter(touched); s.base=keep.length; s.roster=key;
    s.games=keep.concat(dealNext(s,keep,roundLen(s.players)));
  } else {                                               // same group — keep every game, add or trim at the end
    const want=Math.max(s.plan||0,s.games.filter(touched).length); let g=s.games.slice();
    while(g.length>want&&!touched(g[g.length-1])) g.pop();
    if(g.length<want) g=g.concat(dealNext(s,g,want-g.length));

  if(R&&!tail.every((g,i)=>matchKey(g)===matchKey(R[i%R.length]))){   // older fixtures: start a proper round after what is scored

/* ===================== referee console =====================
   The Pickleboss court: rally scoring, the ball marks the server, partners
   swap sides when they win a point on serve, ends change at the set score.
   g.log holds one entry per rally ('a' or 'b' — who won it), so Undo is
   exact and the score can never drift from the court positions. */
function replayPB(m){
  const log=m.log||[], first=(m.server==='b')?'b':'a';
  const pos={a:(m.posA===1?[1,0]:[0,1]), b:(m.posB===1?[1,0]:[0,1])};
  let a=0,b=0,serving=first, who=pos[first][0];
  log.forEach(w=>{ if(w==='a')a++; else b++;
    if(w===serving){ pos[serving]=[pos[serving][1],pos[serving][0]]; }
    else { serving=w; const sc=(serving==='a')?a:b; who=pos[serving][sc%2===0?0:1]; } });
  return {a,b,serving,pos,servePos:(pos[serving][0]===who?'R':'L'),rallies:log.length};
}
const refGame = () => { if(!S.ref) return null; const [sid,n]=S.ref.split(':'); return getGame(sid,n); };
function openRef(ref){
  const [sid,n]=ref.split(':'), g=getGame(sid,n); if(!g) return;
  if(!canScore()) return toast('Unlock scoring first');
  if(g.log==null && played(g) && !confirm('This game already has a typed score of '+g.sa+'–'+g.sb+'. The court console starts it again from 0–0. Continue?')) return;
  g.server=g.server||'a'; g.posA=g.posA||0; g.posB=g.posB||0; g.startLeft=g.startLeft||'a'; g.invert=!!g.invert;
  if(g.log==null) g.log=[];
  S.ref=ref; document.body.classList.add('reflock'); save(); renderRef();
}
function closeRef(){ S.ref=null; document.body.classList.remove('reflock'); $('refRoot').innerHTML=''; render(); }
function refPoint(side){ const g=refGame(); if(!g) return; const st=replayPB(g); if(gameOver(st.a,st.b)) return;
  g.log=(g.log||[]).concat([side]); const n=replayPB(g); g.sa=n.a; g.sb=n.b; save(); renderRef(); }
function refMinus(side){ const g=refGame(); if(!g||!(g.log||[]).length) return; const log=g.log.slice();
  for(let i=log.length;i>0;i--){ const before=replayPB(Object.assign({},g,{log:log.slice(0,i-1)})), after=replayPB(Object.assign({},g,{log:log.slice(0,i)}));
    if(after[side]>before[side]){ log.splice(i-1,1); g.log=log; break; } }
  const n=replayPB(g); g.sa=n.a; g.sb=n.b; save(); renderRef(); }
function refUndo(){ const g=refGame(); if(!g||!(g.log||[]).length) return; g.log=g.log.slice(0,-1);
  const n=replayPB(g); g.sa=n.a; g.sb=n.b; save(); renderRef(); }
function refSet(k,v){ const g=refGame(); if(!g||(g.log||[]).length) return; g[k]=v; save(); renderRef(); }
function refInvert(){ const g=refGame(); if(!g) return; g.invert=!g.invert; save(); renderRef(); }
function refClear(){ const g=refGame(); if(!g||!confirm('Clear this game back to 0–0?')) return; g.log=[]; g.sa=null; g.sb=null; save(); renderRef(); }
function refFinish(){
  const g=refGame(); if(!g) return closeRef();
  if(!(g.log||[]).length){ g.sa=null; g.sb=null; g.log=null; save(); toast('Closed — nothing recorded'); return closeRef(); }
  const st=replayPB(g); g.sa=st.a; g.sb=st.b; save(); toast('Saved · '+st.a+'–'+st.b); closeRef();
}

function hours(){
  const m={}; S.sessions.forEach(s=>{ (m[s.start]=m[s.start]||[]).push(s); });
  return Object.keys(m).sort((a,b)=>toMin(a)-toMin(b)).map(k=>({start:k,list:m[k].sort((a,b)=>a.court.localeCompare(b.court,undefined,{numeric:true}))}));
}
function autoHour(H){
  const d=new Date(), now=d.getHours()*60+d.getMinutes();
  const live=H.find(h=>{ const a=toMin(h.start), b=a+Math.max(...h.list.map(s=>s.mins||60)); return now>=a&&now<b; });
  if(live) return live.start;
  const open=H.find(h=>h.list.some(s=>s.games.some(g=>!played(g))));
  return (open||H[0]||{}).start||'';
}
const courtNames = () => [...new Set(S.sessions.map(s=>s.court))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));

  if(String(S.hour||'').indexOf('c:')===0&&courtNames().indexOf(S.hour.slice(2))>=0) return S.hour;
  return H.some(h=>h.start===S.hour)?S.hour:autoHour(H); }

/* how many times this pair has already partnered in the same round (or the
   whole court when it is not running a set round) — 0 means first time */
function segStart(s,i){ const R=roundInfo(s); if(!R||i<R.base) return 0; return R.base+Math.floor((i-R.base)/R.len)*R.len; }
function pairBefore(s,i,team){ const k=pairKey(team[0],team[1]), st=segStart(s,i); let n=0;
  for(let j=st;j<i;j++){ const g=s.games[j]; if(pairKey(g.a[0],g.a[1])===k||pairKey(g.b[0],g.b[1])===k) n++; } return n; }
const ORD=['','','2nd','3rd','4th','5th','6th'];
function repeatSummary(s){
  const seen={}, out=[]; s.games.forEach((g,i)=>[g.a,g.b].forEach(t=>{ const n=pairBefore(s,i,t); if(n){ const k=pairKey(t[0],t[1]);
    if(!seen[k]){ seen[k]=1; const first=s.games.findIndex((x,j)=>j>=segStart(s,i)&&(pairKey(x.a[0],x.a[1])===k||pairKey(x.b[0],x.b[1])===k));
      out.push(esc(t.join(' & '))+' <span class="dimtxt">G'+(first+1)+' &amp; G'+(i+1)+'</span>'); } } }));
  return out.length?`<div class="rptSum"><b>Partners twice${roundInfo(s)?' in a round':''}:</b> ${out.join(' · ')}</div>`:'';
}

}

/* ---------- Players: each person's night ---------- */
function allPlayers(){
  const seen={}, out=[];
  S.sessions.forEach(s=>{ s.players.forEach(p=>{ if(p&&!seen[p]){ seen[p]=1; out.push(p); } });
    s.games.forEach(g=>[...g.a,...g.b,...g.sit].forEach(p=>{ if(p&&!seen[p]){ seen[p]=1; out.push(p); } })); });
  return out;
}
function playerNight(name){
  const out=[];
  sortedSessions().forEach(s=>s.games.forEach((g,i)=>{
    if([...g.a,...g.b,...g.sit].indexOf(name)<0) return;
    const sits=g.sit.indexOf(name)>=0, mine=g.a.indexOf(name)>=0?'a':'b';
    out.push({s,g,i,sits,t:gameMin(s,i),partner:sits?'':(mine==='a'?g.a:g.b).filter(x=>x!==name)[0],
      vs:sits?[]:(mine==='a'?g.b:g.a),ms:mine==='a'?g.sa:g.sb,ts:mine==='a'?g.sb:g.sa}); }));
  return out.sort((x,y)=>x.t-y.t);
}

/* ---------- Groups ----------
   Who is on which court. The admin sets the courts and times in Setup; the
   organiser keeps the names right here. A name on two courts at the same time

function dupInfo(){
  const mk={}, ban=[];
  slotStarts().forEach(t=>{ const by={};
    S.sessions.filter(s=>s.start===t).forEach(s=>s.players.forEach((p,i)=>{ const k=normName(p); if(k) (by[k]=by[k]||[]).push({s,i,p}); }));
    Object.keys(by).forEach(k=>{ const l=by[k]; if(l.length<2) return; ban.push(l);
      l.forEach(x=>{ const o=l.filter(y=>y!==x).map(y=>(y.s===x.s?'this court':y.s.court)+(y.p!==x.p?' as “'+y.p+'”':''));
        (mk[x.s.id]=mk[x.s.id]||{})[x.i]='Repeated — also on '+o.join(' and ')+(S.sessions.filter(z=>z.start===t).length>1||x.s!==l[0].s?' at the same time':''); }); }); });
  return {mk,ban};
}

/* ---------- Stats ---------- */
function computeStats(sid){
  const sessions=sid?S.sessions.filter(s=>s.id===sid):sortedSessions();
  const P={}, pairs={}, opp={}, log=[];
  const ensure=n=>P[n]||(P[n]={name:n,p:0,w:0,l:0,pf:0,pa:0,sat:0,form:[],cur:0,best:0});
  sessions.forEach(s=>{ s.players.forEach(ensure);
    s.games.forEach(g=>{ if(!played(g)) return;
      g.sit.forEach(n=>ensure(n).sat++);
      [['a','sa','sb','b'],['b','sb','sa','a']].forEach(([t,f,o,ot])=>{
        const won=g[f]>g[o];
        g[t].forEach(n=>{ const r=ensure(n); r.p++; r.pf+=g[f]; r.pa+=g[o];
          if(won){r.w++; r.cur++; r.best=Math.max(r.best,r.cur);} else {r.l++; r.cur=0;} r.form.push(won?'W':'L'); });
        const k=pairKey(g[t][0],g[t][1]), pr=pairs[k]||(pairs[k]={names:[g[t][0],g[t][1]].sort(),p:0,w:0,l:0,pf:0,pa:0});
        pr.p++; pr.pf+=g[f]; pr.pa+=g[o]; won?pr.w++:pr.l++;
        g[t].forEach(x=>g[ot].forEach(y=>{ const q=opp[x+'>'+y]||(opp[x+'>'+y]={p:0,w:0,l:0}); q.p++; won?q.w++:q.l++; }));
      });
      log.push({s,g});
    }); });
  const rows=Object.values(P).map(r=>Object.assign(r,{d:r.pf-r.pa,pct:r.p?r.w/r.p:0}));
  rows.sort((x,y)=>((y.p?1:0)-(x.p?1:0))||(y.pct-x.pct)||(y.d-x.d)||(y.pf-x.pf)||(y.w-x.w)||x.name.localeCompare(y.name));
  rows.forEach((r,i)=>{ const pr=rows[i-1];
    r.rank=!r.p?'':(pr&&pr.p&&pr.pct===r.pct&&pr.d===r.d&&pr.pf===r.pf)?pr.rank:i+1; });
  const prs=Object.values(pairs).map(r=>Object.assign(r,{d:r.pf-r.pa,pct:r.w/r.p}))
    .sort((x,y)=>(y.pct-x.pct)||(y.w-x.w)||(y.d-x.d)||x.names.join().localeCompare(y.names.join()));
  return {rows,pairs:prs,opp,log};
}
const pctTxt = r => r.p?Math.round(r.pct*100)+'%':'–';
const sgn = d => (d>0?'+':'')+d;
const rkHTML = r => r.rank?`<span class="rk ${r.rank<=3?'r'+r.rank:''}">${r.rank}</span>`:'<span class="rk">–</span>';
function highlights(st){
  const out=[], top=st.rows.find(r=>r.p);
  if(top) out.push(['Top of the table',top.name,`${top.w}W ${top.l}L · ${pctTxt(top)} · ${sgn(top.d)}`]);
  const bp=st.pairs.find(p=>p.p>=2)||st.pairs[0];
  if(bp) out.push(['Best partnership',bp.names.join(' & '),`${bp.w}W ${bp.l}L together · ${sgn(bp.d)}`]);
  let big=null; st.log.forEach(o=>{ const m=Math.abs(o.g.sa-o.g.sb); if(!big||m>big.m) big={m,o}; });
  if(big){ const g=big.o.g, aw=g.sa>g.sb;
    out.push(['Biggest win',(aw?g.a:g.b).join(' & '),`${Math.max(g.sa,g.sb)}–${Math.min(g.sa,g.sb)} over ${(aw?g.b:g.a).join(' & ')} · ${big.o.s.court}`]); }
  if(st.log.length){ const close=st.log.filter(o=>Math.abs(o.g.sa-o.g.sb)<=2).length;
    const gold=st.log.filter(o=>isFinite(CAP)&&Math.max(o.g.sa,o.g.sb)===CAP&&Math.min(o.g.sa,o.g.sb)===GOLDEN).length;
    out.push(['Nail-biters',close+' game'+(close===1?'':'s')+' won by 2 or less',isFinite(CAP)?gold+' decided on the golden point':'']); }
  const pf=st.rows.slice().sort((a,b)=>b.pf-a.pf)[0];
  if(pf&&pf.p) out.push(['Most points scored',pf.name,`${pf.pf} points in ${pf.p} games`]);
  const strk=st.rows.slice().sort((a,b)=>b.best-a.best)[0];
  if(strk&&strk.best>=2) out.push(['Longest winning run',strk.name,`${strk.best} wins in a row`]);
  return out;
}

function renamePlayer(id,i,v){
  if(!canEdit()) return; const s=sessById(id); if(!s) return; const old=s.players[i], nu=cleanName(v);

    <div class="cmRow" style="margin-top:8px"><input class="txt" id="cm_new" list="cm_known" placeholder="Add a player — new or from another court" onkeydown="if(event.key==='Enter')cmAdd('${id}')">

const clashAt = (p,start,except) => S.sessions.find(x=>x.id!==except&&x.start===start&&x.players.indexOf(p)>=0);
function cmAdd(id){ if(!canEdit()) return; const s=sessById(id), el=$('cm_new'), v=(el?el.value:'').trim(); if(!s) return;
  if(!v) return toast('Type a name first'); if(s.players.indexOf(v)>=0) return toast(v+' is already on this court');
  const c=clashAt(v,s.start,id);
  if(c){ if(!confirm(v+' is already on '+c.court+' at this time. Move '+v+' from '+c.court+' to '+s.court+'?')) return;
    c.players=c.players.filter(x=>x!==v); replan(c); }
  s.players.push(v); replan(s); save(); render(); refreshCourt(); toast(v+(c?' moved from '+c.court:' added')+' · unplayed games re-dealt'); }
function cmRemove(id,i){ if(!canEdit()) return; const s=sessById(id), p=s&&s.players[i]; if(!p) return;
  if(!confirm('Take '+p+' off '+sessName(s)+'? Unplayed games are re-dealt; scored games stay.')) return;
  s.players.splice(i,1); replan(s); save(); render(); refreshCourt(); toast(p+' taken off · unplayed games re-dealt'); }
function cmAction(id,i,v){ if(!canEdit()||!v) return; const s=sessById(id), p=s&&s.players[i], q=v.split('|'), t=sessById(q[1]); if(!p||!t) return refreshCourt();
  if(q[0]==='m'){ if(t.players.indexOf(p)>=0){ toast(p+' is already on '+sessName(t)); return refreshCourt(); }
    const c=clashAt(p,t.start,s.id); if(c&&c.id!==t.id){ toast(p+' already plays at that time on '+c.court+' — use swap or take them off there first'); return refreshCourt(); }
    s.players.splice(i,1); t.players.push(p); replan(s); replan(t); save(); render(); refreshCourt();
    return toast(p+' moved to '+sessName(t)); }
  const j=+q[2], o=t.players[j]; if(!o) return refreshCourt();
  if(t.players.indexOf(p)>=0||s.players.indexOf(o)>=0){ toast('One of them is already on both courts'); return refreshCourt(); }
  s.players[i]=o; t.players[j]=p; replan(s); replan(t); save(); render(); refreshCourt(); toast(p+' ⇄ '+o+' swapped'); }

const brandList = k => k==='organisers'?(S.organisers||[]):(S.sponsors||[]);

function brandChanged(msg){ normBrand(S); save(); render(); if(msg) toast(msg); }
function addBrand(k){ if(!isAdmin()) return; const l=brandList(k).slice(); if(l.length>=BRAND[k].max()) return;
  l.push({id:k[0]+Date.now().toString(36),name:'',logo:'',invert:false}); setBrandList(k,l); save(); render(); }

function clearBrandLogo(k,id){ if(!isAdmin()) return; const o=findBrand(k,id); if(!o||!confirm('Remove this logo?')) return; o.logo=''; o.invert=false; brandChanged('Logo removed'); }
function removeBrand(k,id,quiet){ if(!isAdmin()||k==='host') return; const o=findBrand(k,id); if(!o) return;
  if(!quiet&&!confirm('Remove '+(o.name||'this entry')+'?')) return; setBrandList(k,brandList(k).filter(x=>x.id!==id)); brandChanged(quiet?'':'Removed'); }
function moveBrand(k,id,dir){ if(!isAdmin()) return; const l=brandList(k).slice(), i=l.findIndex(o=>o.id===id), j=i+dir;
  if(i<0||j<0||j>=l.length) return; [l[i],l[j]]=[l[j],l[i]]; setBrandList(k,l); brandChanged(); }
const LOGO_BUDGET=120000;
function pickLogo(k,id,el){ const f=el.files&&el.files[0]; el.value=''; if(!f) return;
  if(!/^image\//.test(f.type)) return toast('That is not an image file');
  readLogo(f).then(url=>{ const o=findBrand(k,id); if(!o) return; o.logo=url; o.invert=false; brandChanged('Logo added · '+Math.round(url.length/1366)+' KB'); })
    .catch(e=>toast(String(e.message||e))); }
function readLogo(file){ return new Promise((res,rej)=>{ const fr=new FileReader();
  fr.onerror=()=>rej(new Error('That file could not be read'));
  fr.onload=()=>{ const img=new Image(); img.onerror=()=>rej(new Error('That image could not be opened'));
    img.onload=()=>{ const draw=(w,h,type,q)=>{ const s=Math.min(1,w/img.width,h/img.height), cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.width*s)); cv.height=Math.max(1,Math.round(img.height*s)); const cx=cv.getContext('2d');
        if(type==='image/jpeg'){ cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); } cx.drawImage(img,0,0,cv.width,cv.height); return cv.toDataURL(type,q); };
      let url=draw(440,180,'image/png'); if(url.length>LOGO_BUDGET) url=draw(300,120,'image/png'); if(url.length>LOGO_BUDGET) url=draw(440,180,'image/jpeg',.86);
      if(url.length>LOGO_BUDGET) return rej(new Error('That image is too detailed to store — try a simpler logo')); res(url); };
    img.src=fr.result; }; fr.readAsDataURL(file); }); }

const qa=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function downloadBranded(){
  if(!isAdmin()) return; const t=S.meta.title+(S.meta.sub?' · '+S.meta.sub:''), d='Live doubles rotation, scores and player stats.';
  try{ const res=await fetch(location.origin+location.pathname,{cache:'reload'}); if(!res.ok) throw 0;
    let html=await res.text(); if(html.indexOf('<title>')<0) throw 0;
    html=html.replace(/<title>[\s\S]*?<\/title>/,'<title>'+qa(t)+'</title>');
    const meta=(a,n,v)=>{ html=html.replace(new RegExp('(<meta '+a+'="'+n+'" content=")[^"]*(")'),'$1'+qa(v)+'$2'); };
    meta('property','og:title',t); meta('name','twitter:title',t); meta('property','og:description',d); meta('name','twitter:description',d);
    meta('property','og:site_name',hostName()); meta('name','description','Live scores — '+t+' · '+hostName());

    html=html.replace(/const SEED_META = \{ title:'[^']*', sub:'[^']*'/,"const SEED_META = { title:'"+e1(S.meta.title)+"', sub:'"+e1(S.meta.sub)+"'");
    html=html.replace(/const BUILD = '[^']*';/,"const BUILD = 'community build "+new Date().toISOString().slice(0,10)+"';");
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download='index.html'; a.click();
    toast('Downloaded — upload this as index.html');
  }catch(e){ toast('Could not read the file here — open it from GitHub Pages and try again'); }
}

/* ---------- WhatsApp & CSV ---------- */
function shareText(scope){
  let t=`*${S.meta.title}*\n${S.meta.sub}${S.meta.venue?' · '+S.meta.venue:''}\n`;
  if(scope==='stand'){
    const st=computeStats(''); t+='\n*Leaderboard*\n';
    st.rows.filter(r=>r.p).forEach(r=>{ t+=`${r.rank}. ${r.name} — ${r.w}W ${r.l}L (${sgn(r.d)})\n`; });
    const hl=highlights(st); if(hl.length){ t+='\n'; hl.forEach(([e,b,s])=>{ t+=`*${e}:* ${b}${s?' — '+s:''}\n`; }); }
  } else if(scope==='sched'){
    sortedSessions().forEach(s=>{ t+=`\n*${s.court} · ${range(s)}*\n`;
      s.games.forEach((g,i)=>{ t+=`${showTimes()?gameTime(s,i):'G'+g.n} ${g.a.join(' & ')} v ${g.b.join(' & ')}${g.sit.length?' _(sits: '+g.sit.join(', ')+')_':''}\n`; }); });
  } else {
    const list=listFor(scope.slice(2));
    list.forEach(s=>{ t+=`\n*${s.court} · ${range(s)}*\n`;
      s.games.forEach(g=>{ t+=played(g)?`G${g.n} ${g.a.join(' & ')} ${g.sa}-${g.sb} ${g.b.join(' & ')}\n`:`G${g.n} ${g.a.join(' & ')} v ${g.b.join(' & ')}\n`; }); });
  }
  let d=0,n=0; S.sessions.forEach(s=>s.games.forEach(g=>{n++; if(played(g)) d++;}));
  const org=organiserLine(), sp=shownSponsors().map(o=>o.name).filter(Boolean);
  t+=`\n_${d} of ${n} games played_`;
  if(org) t+=`\nOrganised by *${org}*`+(eventPhone()?' · '+eventPhone():'');
  if(sp.length) t+=`\n_${sp.length===1?'Sponsor':'Sponsors'}: ${sp.join(' · ')}_`;
  return t+`\nHosted on *${hostName()}*`+(hostPhone()?' · '+hostPhone():'');
}
function shareModal(scope){
  if(!canShare()){ toast('Not allowed on this device'); return ''; }

function copyShare(){ const el=$('shareTxt'); el.removeAttribute('readonly'); el.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}

function exportCSV(){

const MEDAL=['','#c9971c','#94a3b8','#b4652a'];
const ifont=(px,w)=>`${w||400} ${px}px ${IMG_FONT}`;
const imgLoad=src=>new Promise(res=>{ if(!src) return res(null); const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
function fitText(ctx,txt,max){ let s=String(txt==null?'':txt); if(ctx.measureText(s).width<=max) return s;
  while(s.length>1&&ctx.measureText(s+'…').width>max) s=s.slice(0,-1); return s+'…'; }
const imgRight=(ctx,t,x,y)=>{ ctx.textAlign='right'; ctx.fillText(t,x,y); ctx.textAlign='left'; };
const imgMid=(ctx,t,x,y)=>{ ctx.textAlign='center'; ctx.fillText(t,x,y); ctx.textAlign='left'; };
function imgRule(ctx,x1,y,x2,col){ ctx.strokeStyle=col||IMG_LINE; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x1,y+.5); ctx.lineTo(x2,y+.5); ctx.stroke(); }
const imgScale=h=>Math.min(IMG_SCALE,Math.max(1.5,Math.sqrt(IMG_MAX_PX/(IMG_W*h))));
function dryCtx(){ const real=document.createElement('canvas').getContext('2d');
  return new Proxy(real,{ get(t,p){ if(p==='measureText') return t.measureText.bind(t); const v=t[p]; return typeof v==='function'?()=>{}:v; },
    set(t,p,v){ t[p]=v; return true; } }); }
function medalDot(ctx,cx,cy,rank,r){ r=r||15;
  if(rank>=1&&rank<=3){ ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=MEDAL[rank]; ctx.fill();
    ctx.font=ifont(r*1.15,800); ctx.fillStyle='#fff'; imgMid(ctx,String(rank),cx,cy+r*.4); }
  else { ctx.font=ifont(r*1.2,700); ctx.fillStyle=IMG_MUTED; imgMid(ctx,rank?String(rank):'–',cx,cy+r*.42); } }
function fiHead(ctx,y,txt,sub){ const L=IMG_PAD, R=IMG_W-IMG_PAD;
  ctx.fillStyle=HEAD_INK; ctx.fillRect(L,y+2,9,40);
  ctx.font=ifont(32,800); ctx.fillStyle=HEAD_INK; ctx.fillText(fitText(ctx,txt,R-L-300),L+24,y+35);
  if(sub){ ctx.font=ifont(17,600); ctx.fillStyle=IMG_MUTED; imgRight(ctx,sub,R,y+33); }
  ctx.fillStyle=HEAD_INK; ctx.fillRect(L,y+52,R-L,3); return y+74; }
const FI_ROW=54, FI_TOP=36;
function fiTie(ctx,x,y,w,t){
  const p=t.sa!=null&&t.sb!=null, wa=p&&t.sa>t.sb, wb=p&&t.sb>t.sa;
  ctx.fillStyle=HEAD_FILL; ctx.fillRect(x,y,w,FI_TOP);
  let hx=x+12; ctx.font=ifont(14,800); const cw=Math.max(28,ctx.measureText(t.code).width+16);
  ctx.fillStyle=HEAD_INK; ctx.fillRect(hx,y+7,cw,22); ctx.fillStyle='#fff'; imgMid(ctx,t.code,hx+cw/2,y+23); hx+=cw+10;
  ctx.font=ifont(14.5,600); ctx.fillStyle='#334155'; ctx.fillText(fitText(ctx,t.head||'',x+w-hx-12),hx,y+24);
  [[t.a,t.sa,wa,p&&!wa],[t.b,t.sb,wb,p&&!wb]].forEach(([nm,sc,win,lost],i)=>{ const ry=y+FI_TOP+i*FI_ROW;
    ctx.fillStyle=win?WIN_TINT:IMG_PAPER; ctx.fillRect(x,ry,w,FI_ROW); if(win){ ctx.fillStyle=WIN_COL; ctx.fillRect(x,ry,6,FI_ROW); }
    ctx.font=ifont(21,win?800:500); ctx.fillStyle=lost?LOSE_INK:IMG_INK; ctx.fillText(fitText(ctx,nm,w-110),x+18,ry+34);
    if(p){ ctx.font=ifont(24,800); ctx.fillStyle=win?WIN_COL:LOSE_INK; imgMid(ctx,String(sc),x+w-40,ry+36); } });
  ctx.strokeStyle=BOX_LINE; ctx.lineWidth=1.5; ctx.strokeRect(x+.75,y+.75,w-1.5,FI_TOP+2*FI_ROW-1.5);
  imgRule(ctx,x,y+FI_TOP,x+w,BOX_LINE); imgRule(ctx,x,y+FI_TOP+FI_ROW,x+w,'#e2e8f0');
  ctx.beginPath(); ctx.moveTo(x+w-80.5,y+FI_TOP); ctx.lineTo(x+w-80.5,y+FI_TOP+2*FI_ROW); ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1; ctx.stroke();
  return y+FI_TOP+2*FI_ROW;
}
function fiGrid(ctx,y,ties){ const L=IMG_PAD, R=IMG_W-IMG_PAD, gap=24, w=(R-L-gap)/2;
  for(let i=0;i<ties.length;i+=2){ let bottom=y; ties.slice(i,i+2).forEach((t,j)=>{ bottom=Math.max(bottom,fiTie(ctx,L+j*(w+gap),y,w,t)); }); y=bottom+20; }
  return y; }
function standingsBody(sid){
  return (ctx,y)=>{ const st=computeStats(sid), L=IMG_PAD, R=IMG_W-IMG_PAD, rowH=52;
    y=fiHead(ctx,y,sid?sessName(sessById(sid)):'Leaderboard',st.log.length+' game'+(st.log.length===1?'':'s')+' played');
    const cols=[['P',54],['W',54],['L',54],['WIN%',84],['+',62],['−',62],['DIFF',80]], fixed=cols.reduce((s,c)=>s+c[1],0), teamW=R-L-64-fixed;
    ctx.fillStyle=HEAD_FILL; ctx.fillRect(L,y,R-L,40); ctx.font=ifont(13.5,800); ctx.fillStyle='#475569';
    imgMid(ctx,'#',L+32,y+26); ctx.fillText('PLAYER',L+64,y+26); let cx=L+64+teamW; cols.forEach(([l,w])=>{ imgMid(ctx,l,cx+w/2,y+26); cx+=w; }); y+=40;
    st.rows.forEach((r,i)=>{ ctx.fillStyle=i%2?'#f8fafc':IMG_PAPER; ctx.fillRect(L,y,R-L,rowH); const mid=y+rowH/2;
      medalDot(ctx,L+32,mid,r.p?r.rank:0,15);
      ctx.font=ifont(22,r.rank&&r.rank<=3?800:600); ctx.fillStyle=r.p?IMG_INK:IMG_MUTED; ctx.fillText(fitText(ctx,r.name,teamW-12),L+64,mid+8);
      let c=L+64+teamW; [r.p,r.w,r.l,pctTxt(r),r.pf,r.pa,sgn(r.d)].forEach((v,k)=>{ ctx.font=ifont(21,k===3||k===6?800:500);
        ctx.fillStyle=k===6?(r.d>0?WIN_COL:r.d<0?'#be123c':IMG_INK):IMG_INK; imgMid(ctx,String(v),c+cols[k][1]/2,mid+7); c+=cols[k][1]; });
      imgRule(ctx,L,y+rowH,R,'#e2e8f0'); y+=rowH; });
    imgRule(ctx,L,y,R,'#94a3b8'); y+=34;
    if(st.pairs.length){ y=fiHead(ctx,y,'Best partnerships',''); st.pairs.slice(0,6).forEach((p,i)=>{
        ctx.fillStyle=i%2?'#f8fafc':IMG_PAPER; ctx.fillRect(L,y,R-L,48);
        ctx.font=ifont(21,700); ctx.fillStyle=IMG_INK; ctx.fillText(fitText(ctx,p.names.join(' & '),R-L-260),L+16,y+31);
        ctx.font=ifont(20,800); imgRight(ctx,p.w+'–'+p.l,R-120,y+31); ctx.fillStyle=p.d>0?WIN_COL:p.d<0?'#be123c':IMG_INK; imgRight(ctx,sgn(p.d),R-16,y+31);
        imgRule(ctx,L,y+48,R,'#e2e8f0'); y+=48; }); y+=30; }
    const hl=highlights(st).filter(h=>/Biggest|Nail|Longest/.test(h[0]));
    hl.forEach(([e,b,s])=>{ ctx.font=ifont(17,800); ctx.fillStyle=HEAD_INK; ctx.fillText(e.toUpperCase(),L,y+16);
      ctx.font=ifont(19,500); ctx.fillStyle=IMG_INK; ctx.fillText(fitText(ctx,b+(s?' — '+s:''),R-L-250),L+250,y+16); y+=32; });
    return y+10; };
}
function gamesBody(hour){
  return (ctx,y)=>{ const list=hour==='all'?sortedSessions():S.sessions.filter(s=>s.start===hour).sort((a,b)=>a.court.localeCompare(b.court,undefined,{numeric:true}));
    list.forEach(s=>{ y=fiHead(ctx,y,s.court+' · '+range(s),s.games.filter(played).length+'/'+s.games.length+' played');
      y=fiGrid(ctx,y,s.games.map((g,i)=>({code:'G'+g.n,head:[gameTime(s,i),g.sit.length?'sits: '+g.sit.join(', '):''].filter(Boolean).join(' · '),
        a:g.a.join(' & '),b:g.b.join(' & '),sa:played(g)?g.sa:null,sb:played(g)?g.sb:null})))+12; });
    return y; };
}
async function makeImage(label,body){
  const marks=await Promise.all(leadMarks().map(o=>imgLoad(orgLogo(o)))), hostIm=await imgLoad(orgLogo(HOST())),
    sponIm=await Promise.all(shownSponsors().map(o=>imgLoad(orgLogo(o)))), L=IMG_PAD, R=IMG_W-IMG_PAD;
  const masthead=ctx=>{ let x=L; const top=IMG_PAD;
    leadMarks().forEach((o,i)=>{ const im=marks[i]; if(im){ const wid=Math.min(240,im.width*(LOGO_IMG_H/im.height)); ctx.drawImage(im,x,top,wid,LOGO_IMG_H); x+=wid+18; }
      else if(o.name){ ctx.font=ifont(26,700); ctx.fillStyle=IMG_INK; ctx.fillText(o.name,x,top+32); x+=ctx.measureText(o.name).width+20; } });
    ctx.font=ifont(14,800); ctx.fillStyle=IMG_INK; imgRight(ctx,label.toUpperCase(),R,top+LOGO_IMG_H/2+5);
    let y=top+LOGO_IMG_H+16; ctx.font=ifont(42,800); ctx.fillStyle=IMG_INK; ctx.fillText(fitText(ctx,S.meta.title,R-L),L,y+36); y+=50;
    const sub=[S.meta.sub,S.meta.venue,organiserLine()?'Organised by '+organiserLine():''].filter(Boolean).join(' · ');
    if(sub){ ctx.font=ifont(20,400); ctx.fillStyle=IMG_MUTED; ctx.fillText(fitText(ctx,sub,R-L),L,y+20); }
    return y+60; };
  const foot=(ctx,y)=>{ ctx.font=ifont(15,400); ctx.fillStyle=IMG_MUTED; ctx.fillText('Games '+rulesShort()+' · ranked by win %, then difference, then points won · + won · − lost',L,y+12); y+=30;
    if(shownSponsors().length){ let sx=L; ctx.font=ifont(13,700); ctx.fillStyle=IMG_MUTED; const lb=shownSponsors().length===1?'SPONSOR':'SPONSORS';
      ctx.fillText(lb,sx,y+22); sx+=ctx.measureText(lb).width+18;
      shownSponsors().forEach((o,i)=>{ const im=sponIm[i]; if(im){ const wid=Math.min(110,im.width*(28/im.height)); ctx.drawImage(im,sx,y+2,wid,28); sx+=wid+16; }
        else if(o.name){ ctx.font=ifont(16,400); ctx.fillStyle=IMG_INK; ctx.fillText(o.name,sx,y+22); sx+=ctx.measureText(o.name).width+18; } }); y+=44; }
    imgRule(ctx,L,y,R); y+=14; const hp=hostPhone(), hn=hostName();
    ctx.font=ifont(18,700); const nw=ctx.measureText(hn).width, ph=hp?'  ·  '+hp:''; ctx.font=ifont(17,400); const pw=ctx.measureText(ph).width;
    const lw=hostIm?Math.min(90,hostIm.width*(32/hostIm.height))+14:0; let bx=(IMG_W-(lw+nw+pw))/2;
    if(hostIm){ ctx.drawImage(hostIm,bx,y+2,lw-14,32); bx+=lw; }
    ctx.font=ifont(18,700); ctx.fillStyle=IMG_INK; ctx.fillText(hn,bx,y+24); bx+=nw;
    if(ph){ ctx.font=ifont(17,400); ctx.fillStyle=IMG_MUTED; ctx.fillText(ph,bx,y+24); } return y+48+IMG_PAD; };
  const d=dryCtx(), H=Math.round(foot(d,body(d,masthead(d)))), sc=imgScale(H), cv=document.createElement('canvas');
  cv.width=Math.round(IMG_W*sc); cv.height=Math.round(H*sc); const ctx=cv.getContext('2d'); ctx.scale(sc,sc); ctx.textBaseline='alphabetic';
  ctx.fillStyle=IMG_PAPER; ctx.fillRect(0,0,IMG_W,H); foot(ctx,body(ctx,masthead(ctx))); return cv;
}
async function shareCanvas(cv,name,title){
  const blob=await new Promise(res=>cv.toBlob(res,'image/png')); if(!blob) return toast('Could not make the image');
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Saved '+name);
}
function imageMenu(){
  if(!canShare()){ toast('Not allowed on this device'); return ''; }
  const btn=(k,l,s)=>`<button class="imgOpt" onclick="closeModal();shareImage('${k}')"><b>${esc(l)}</b>${s?`<span>${esc(s)}</span>`:''}</button>`;
  return `<h3>Share as image</h3><p class="hint">Pick what to send. On a phone it opens the share sheet, so it goes straight into WhatsApp.</p>
    <div class="eyebrow" style="margin:14px 2px 8px">Standings</div><div class="imgGrid">
      ${btn('st:','All games','leaderboard, best pairs, highlights')}
      ${sortedSessions().map(s=>btn('st:'+s.id,s.court+' · '+range(s),'that court only')).join('')}</div>
    <div class="eyebrow" style="margin:14px 2px 8px">Games &amp; scores</div><div class="imgGrid">
      ${hours().map(h=>btn('g:'+h.start,range(h.list[0]),h.list.map(s=>s.court).join(' & '))).join('')}
      ${btn('g:all','All games','every court, every game')}</div>
    <div class="row" style="margin-top:16px"><button class="btn" style="flex:1" onclick="closeModal()">Close</button></div>`;
}
async function shareImage(key){
  if(!canShare()) return; toast('Drawing the image…');
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const st=key.startsWith('st:'), v=key.slice(st?3:2);
    const label=st?(v?sessName(sessById(v)):'Standings'):(v==='all'?'All games':'Games · '+range(hours().find(h=>h.start===v).list[0]));
    const cv=await makeImage(st?'Standings':'Games',st?standingsBody(v):gamesBody(v));
    const slug=s=>String(s||'').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-');
    await shareCanvas(cv,slug(S.meta.title)+'-'+slug(label)+'.png',S.meta.title+' · '+label);
  }catch(e){ toast('Image failed: '+(e.message||e)); }
}

/* ---------- print ---------- */
function printHead(t,r){
  return `<div class="bb">${leadMarks().map(o=>orgLogo(o)?`<img src="${orgLogo(o)}" alt="">`:'').join('')}
    <div class="bt"><div class="t">${esc(t)}</div><div class="r">${esc(S.meta.title)} · ${esc(S.meta.sub)}${S.meta.venue?' · '+esc(S.meta.venue):''}${r?' · '+esc(r):''}</div></div>
    ${eventPhone()?`<div class="ct">Queries on court<b>${esc(eventPhone())}</b>${esc(organiserLine()||hostName())}</div>`:''}</div>`;
}
function printFoot(legend){ const sp=shownSponsors();
  return `${legend?`<div class="legend">${legend}</div>`:''}${sp.length?`<div class="pstrip"><span class="plbl">${sp.length===1?'Sponsor':'Sponsors'}</span>
    ${sp.map(o=>`<span class="pitem">${orgLogo(o)?`<img src="${orgLogo(o)}" alt="">`:''}${o.name?esc(o.name):''}</span>`).join('')}</div>`:''}
    <div class="foot"><img src="${orgLogo(HOST())}" alt=""><b>${esc(hostName())}</b>${hostPhone()?' · '+esc(hostPhone()):''}</div>`; }
function printSchedule(withData){
  // one court per sheet, so each court's referee gets their own page
  return sortedSessions().filter(s=>s.games.length||s.players.length).map(s=>{ const R=roundInfo(s);
    return `<div class="pg">${printHead(s.court+' · '+range(s),rulesShort())}
    <h4>${esc(s.court)} <span>· ${esc(s.players.join(', '))}</span></h4><table>
      <tr><th class="n">G</th><th class="tm">${showTimes()?'Time':''}</th><th>Team</th><th class="sc">Score</th><th class="sc">Score</th><th>Team</th><th class="st">Sitting out</th></tr>
      ${s.games.map((g,i)=>{ const p=withData&&played(g), ra=pairBefore(s,i,g.a), rb=pairBefore(s,i,g.b);
        const head=R&&i>=R.base&&(i-R.base)%R.len===0&&(s.games.length-R.base>R.len)?`<tr class="rd"><td colspan="7">Round ${(i-R.base)/R.len+1}${i>R.base?' — the same games again':''}</td></tr>`:'';
        return head+`<tr><td class="n">${g.n}</td><td class="tm">${gameTime(s,i)}</td>
        <td class="${p&&g.sa>g.sb?'w':''}">${esc(g.a.join(' & '))}${ra?' <i class="rp">↻</i>':''}</td><td class="sc">${p?g.sa:''}</td><td class="sc">${p?g.sb:''}</td>
        <td class="${p&&g.sb>g.sa?'w':''}">${esc(g.b.join(' & '))}${rb?' <i class="rp">↻</i>':''}</td><td class="st">${esc(g.sit.join(', '))}</td></tr>`; }).join('')}
      ${[1,2].map(k=>`<tr><td class="n">${s.games.length+k}</td><td class="tm"></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}</table>
    ${printFoot('↻ = this pair partnered earlier in the round. Spare rows are for extra games if there is time.')}</div>`; }).join('');
}
function slotHead(t){ for(const s of sortedSessions()){ const i=s.games.findIndex((g,j)=>gameMin(s,j)===t); if(i>=0) return range(s)+' · G'+(i+1); } return ''; }
function printPlayers(){
  const times=[...new Set(sortedSessions().flatMap(s=>s.games.map((g,i)=>gameMin(s,i))))].sort((a,b)=>a-b);
  const names=allPlayers().slice().sort((a,b)=>a.localeCompare(b));
  return `<div class="pg">${printHead('Who plays when',times.length+' slots')}<table class="ps">
    <tr><th class="who">Player</th>${times.map(t=>`<th>${showTimes()?clock(t,true,false):esc(slotHead(t))}</th>`).join('')}</tr>
    ${names.map(n=>{ const night=playerNight(n);
      return `<tr><td class="who">${esc(n)}</td>${times.map(t=>{ const x=night.find(y=>y.t===t);
        if(!x) return '<td class="off">—</td>'; if(x.sits) return `<td class="off"><span class="c">${esc(x.s.court.replace(/^Court\s*/i,'C'))}</span>sits</td>`;
        return `<td><span class="c">${esc(x.s.court.replace(/^Court\s*/i,'C'))}</span>w/ ${esc(x.partner)}</td>`; }).join('')}</tr>`; }).join('')}</table>
    ${printFoot('C1, C2 … is the court; “w/” is the partner for that game; “sits” means sitting out on that court.')}</div>`;
}
function printStandings(){ const st=computeStats('');

    ${st.rows.map(r=>`<tr><td class="n">${r.rank}</td><td>${esc(r.name)}</td><td class="sc">${r.p}</td><td class="sc">${r.w}</td><td class="sc">${r.l}</td>

    ${printFoot('+ points won · − points lost · Diff = + minus −. Ranked by win percentage, then difference, then points won.')}</div>`; }
